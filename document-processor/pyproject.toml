[project]
name = "documind-document-processor"
version = "0.1.0"
description = "DocuMind PDF document processor"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "grpcio>=1.83,<2",
    "httpx>=0.28,<1",
    "protobuf>=7.35,<8",
    "pypdf>=5.0,<7",
    "uvicorn>=0.34,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
