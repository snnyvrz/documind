name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: documind
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: documind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind -d documind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum
      - name: Run Go tests
        working-directory: api
        run: go test ./...
      - name: Run PostgreSQL integration tests
        working-directory: api
        env:
          DATABASE_URL: postgres://documind:documind@127.0.0.1:5432/documind?sslmode=disable
        run: go test -tags=integration ./...

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: document-processor/uv.lock
      - name: Install dependencies
        working-directory: document-processor
        run: uv sync --locked
      - name: Run tests
        working-directory: document-processor
        run: uv run pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: frontend
        run: bun run build
      - name: Lint
        working-directory: frontend
        run: bun run lint
      - name: Install Playwright browser
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Run mocked Playwright workflows
        working-directory: frontend
        run: bun run test:e2e
