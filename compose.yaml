services:
  api:
    build:
      context: ./api
    expose:
      - "1323"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      UPLOAD_DIRECTORY: /data
      UPLOAD_ORPHAN_MIN_AGE: ${UPLOAD_ORPHAN_MIN_AGE:-1h}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-minio:9000}
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-documind}
      DOCUMENT_PROCESSOR_GRPC_URL: document-processor:50051
      DOCUMENT_JOB_MAX_ATTEMPTS: ${DOCUMENT_JOB_MAX_ATTEMPTS:-5}
      DOCUMENT_JOB_INITIAL_BACKOFF: ${DOCUMENT_JOB_INITIAL_BACKOFF:-5s}
      DOCUMENT_JOB_MAX_BACKOFF: ${DOCUMENT_JOB_MAX_BACKOFF:-5m}
      DOCUMENT_JOB_LEASE_DURATION: ${DOCUMENT_JOB_LEASE_DURATION:-2m}
      DOCUMENT_JOB_LEASE_RENEWAL: ${DOCUMENT_JOB_LEASE_RENEWAL:-30s}
      DOCUMENT_JOB_PROCESSING_TIMEOUT: ${DOCUMENT_JOB_PROCESSING_TIMEOUT:-30m}
      DOCUMENT_JOB_POLL_INTERVAL: ${DOCUMENT_JOB_POLL_INTERVAL:-1s}
      DOCUMENT_JOB_WORKERS: ${DOCUMENT_JOB_WORKERS:-2}
      ANSWER_GENERATION_TIMEOUT: ${ANSWER_GENERATION_TIMEOUT:-5m}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      AUTH_MODE: ${AUTH_MODE:-production}
      LEGACY_DOCUMENT_OWNER: ${LEGACY_DOCUMENT_OWNER:?LEGACY_DOCUMENT_OWNER is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-documind}
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-8h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REQUIRE_HTTPS: ${AUTH_REQUIRE_HTTPS:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      document-processor:
        condition: service_healthy
      minio:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:1323/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  document-processor:
    build:
      context: ./document-processor
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
      MAX_EXTRACTED_TEXT_BYTES: ${MAX_EXTRACTED_TEXT_BYTES:-26214400}
      MAX_CHUNKS: ${MAX_CHUNKS:-10000}
      PDF_EXTRACTION_TIMEOUT: ${PDF_EXTRACTION_TIMEOUT:-60}
      PDF_EXTRACTION_MEMORY_BYTES: ${PDF_EXTRACTION_MEMORY_BYTES:-536870912}
      PDF_EXTRACTION_CPU_SECONDS: ${PDF_EXTRACTION_CPU_SECONDS:-60}
      TOKEN_CHUNK_SIZE: ${TOKEN_CHUNK_SIZE:-800}
      TOKEN_CHUNK_OVERLAP: ${TOKEN_CHUNK_OVERLAP:-80}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RETRIEVAL_LIMIT: ${RETRIEVAL_LIMIT:-5}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-120}
      GRPC_MAX_WORKERS: ${GRPC_MAX_WORKERS:-4}
      INGESTION_CAPACITY: ${INGESTION_CAPACITY:-2}
      QUESTION_CAPACITY: ${QUESTION_CAPACITY:-2}
      EMBEDDING_CAPACITY: ${EMBEDDING_CAPACITY:-2}
    expose:
      - "8000"
      - "50051"
    depends_on:
      ollama:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    expose:
      - "9000"
      - "9001"
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    command:
      - /bin/ollama serve & until /bin/ollama show "$${OLLAMA_EMBEDDING_MODEL}" >/dev/null 2>&1 && /bin/ollama show "$${OLLAMA_CHAT_MODEL}" >/dev/null 2>&1; do /bin/ollama pull "$${OLLAMA_EMBEDDING_MODEL}" || true; /bin/ollama pull "$${OLLAMA_CHAT_MODEL}" || true; sleep 2; done; wait
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ollama show "$${OLLAMA_EMBEDDING_MODEL}" >/dev/null 2>&1 && ollama show "$${OLLAMA_CHAT_MODEL}" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      start_period: 15m
      retries: 60
    volumes:
      - ollama_data:/root/.ollama

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  frontend:
    build:
      context: ./frontend
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?TRUSTED_PROXY_CIDR is required}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  object_storage_data:
