services:
  api:
    build:
      context: ./api
    ports:
      - "1323:1323"
    environment:
      DATABASE_URL: postgres://documind:documind@db:5432/documind?sslmode=disable
      UPLOAD_DIRECTORY: /data
      DOCUMENT_PROCESSOR_GRPC_URL: document-processor:50051
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      document-processor:
        condition: service_started

  document-processor:
    build:
      context: ./document-processor
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-4000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-400}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    expose:
      - "8000"
      - "50051"
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    command:
      - /bin/ollama serve & until /bin/ollama show "$${OLLAMA_EMBEDDING_MODEL}" >/dev/null 2>&1 && /bin/ollama show "$${OLLAMA_CHAT_MODEL}" >/dev/null 2>&1; do /bin/ollama pull "$${OLLAMA_EMBEDDING_MODEL}" || true; /bin/ollama pull "$${OLLAMA_CHAT_MODEL}" || true; sleep 2; done; wait
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ollama show "$${OLLAMA_EMBEDDING_MODEL}" >/dev/null 2>&1 && ollama show "$${OLLAMA_CHAT_MODEL}" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      start_period: 15m
      retries: 60
    volumes:
      - ollama_data:/root/.ollama

  db:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data:
