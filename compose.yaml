services:
  api:
    build:
      context: ./api
    expose:
      - "1323"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      UPLOAD_DIRECTORY: /data
      DOCUMENT_PROCESSOR_GRPC_URL: document-processor:50051
      DOCUMENT_JOB_MAX_ATTEMPTS: ${DOCUMENT_JOB_MAX_ATTEMPTS:-5}
      DOCUMENT_JOB_INITIAL_BACKOFF: ${DOCUMENT_JOB_INITIAL_BACKOFF:-5s}
      DOCUMENT_JOB_MAX_BACKOFF: ${DOCUMENT_JOB_MAX_BACKOFF:-5m}
      DOCUMENT_JOB_LEASE_DURATION: ${DOCUMENT_JOB_LEASE_DURATION:-2m}
      DOCUMENT_JOB_LEASE_RENEWAL: ${DOCUMENT_JOB_LEASE_RENEWAL:-30s}
      DOCUMENT_JOB_PROCESSING_TIMEOUT: ${DOCUMENT_JOB_PROCESSING_TIMEOUT:-30m}
      DOCUMENT_JOB_POLL_INTERVAL: ${DOCUMENT_JOB_POLL_INTERVAL:-1s}
      ANSWER_GENERATION_TIMEOUT: ${ANSWER_GENERATION_TIMEOUT:-5m}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      AUTH_MODE: ${AUTH_MODE:-production}
      LEGACY_DOCUMENT_OWNER: ${LEGACY_DOCUMENT_OWNER:?LEGACY_DOCUMENT_OWNER is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-documind}
      AUTH_JWT_TTL: ${AUTH_JWT_TTL:-8h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_REQUIRE_HTTPS: ${AUTH_REQUIRE_HTTPS:-true}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      document-processor:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:1323/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  document-processor:
    build:
      context: ./document-processor
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      CHUNK_SIZE: ${CHUNK_SIZE:-4000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-400}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-32}
      RETRIEVAL_LIMIT: ${RETRIEVAL_LIMIT:-5}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
      OLLAMA_CHAT_TIMEOUT: ${OLLAMA_CHAT_TIMEOUT:-120}
    expose:
      - "8000"
      - "50051"
    depends_on:
      ollama:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "uv", "run", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    environment:
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:7b}
    command:
      - /bin/ollama serve & until /bin/ollama show "$${OLLAMA_EMBEDDING_MODEL}" >/dev/null 2>&1 && /bin/ollama show "$${OLLAMA_CHAT_MODEL}" >/dev/null 2>&1; do /bin/ollama pull "$${OLLAMA_EMBEDDING_MODEL}" || true; /bin/ollama pull "$${OLLAMA_CHAT_MODEL}" || true; sleep 2; done; wait
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'ollama show "$${OLLAMA_EMBEDDING_MODEL}" >/dev/null 2>&1 && ollama show "$${OLLAMA_CHAT_MODEL}" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      start_period: 15m
      retries: 60
    volumes:
      - ollama_data:/root/.ollama

  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
