syntax = "proto3";

package extractor;

option go_package = "api/proto;extractorpb";

service TextExtractor {
  rpc Extract(ExtractRequest) returns (ExtractResponse);
}

message ExtractRequest {
  string document_id = 1;
  bytes pdf = 2;
}

message ExtractResponse {
  string document_id = 1;
  string text = 2;
  uint32 page_count = 3;
}
